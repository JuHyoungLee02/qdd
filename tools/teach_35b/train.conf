# E-TEACH-35B training defaults (sourced by tools/teach_35b/train.sh; extra CLI args override).
# L8 recipe (prereg_teach_l8 §3.5) carried over; MICRO 4 x ACCUM 4 = global 16 like L8 (micro 8 runs out of memory on
# one H200: 248k-vocabulary logits; 50-step smoke peak 108.8 GB at micro 4 — results/teach_35b_ready.md 4.3)
MODEL=/data/harvest/models/Qwen3.5-35B-A3B
EPOCHS=2
LR=1e-4
R=16
ALPHA=32
MICRO=4
ACCUM=4
WARMUP=20
WORKERS=6
LOG_EVERY=5
EXPERTS_IMPL=grouped_mm
# package overlay on PYTHONPATH: flash-linear-attention 0.5.2 (Gated DeltaNet Triton kernels) = 3.0x faster than the torch
# reference path, same losses (results/teach_35b_ready.md 4.4); PYLIB= (empty) turns it off
PYLIB=${PYLIB-/data/harvest/pylib_fla052}
